server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The dataset size and the simulated database round-trip. The slow defaults
# are the point — see SlowStore's class comment before changing them.
app.seed-rows=${SEED_ROWS:150000}
app.db-delay-ms=${DB_DELAY_MS:30}
